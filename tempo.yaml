# Monolithic Tempo 3 config (no ingester/compactor blocks: Tempo 3 runs them in-process).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: '0.0.0.0:4317'
        http:
          endpoint: '0.0.0.0:4318'

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Service graphs + span metrics, remote-written to Prometheus (same processors as production).
metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  registry:
    external_labels:
      source: tempo

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      processor:
        span_metrics:
          dimensions: [deployment.environment.name]
        service_graphs:
          dimensions: [deployment.environment.name]

usage_report:
  reporting_enabled: false
