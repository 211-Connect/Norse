name: Production Deploy

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      images_only:
        description: Push images without waiting for deployments (first rollout, before the apps exist)
        type: boolean
        default: true

# Note: the release has already shipped by the time a public image is active,
# and nothing rolls back on failure: failures are alert-only (Slack). The one
# exception is the order: public images are only pushed once both CMS apps are
# active, so a failed CMS deploy leaves the public apps on the previous release.
# E2E does not run against production: production hosts are enforced by Arcjet
# bot protection, which is expected to deny headless Chromium (see
# docs/bot-protection.md). E2E runs against the dev hosts, which stay unenforced.
jobs:
  deploy:
    uses: ./.github/workflows/deploy-images.yaml
    with:
      environment: production
      umami_script_url: ${{ vars.PRODUCTION_UMAMI_SCRIPT_URL }}
      allow_search_engines: 'true'
      images_only: ${{ inputs.images_only == true }}
    secrets:
      DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      MULTITENANT_CMS_APP_ID: ${{ secrets.DO_MULTITENANT_CMS_PROD_APP_ID }}
      MBOA_CMS_APP_ID: ${{ secrets.DO_MBOA_CMS_PROD_APP_ID }}
      MULTITENANT_APP_ID: ${{ secrets.DO_MULTITENANT_PROD_APP_ID }}
      MBOA_APP_ID: ${{ secrets.DO_MBOA_PROD_APP_ID }}

  notify-deploy-failure:
    if: always() && needs.deploy.result == 'failure'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification - Deploy Failed
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: *Production Deploy Failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Production Deploy Failed*\nAn image could not be built or pushed, or its deployment did not become active. Public images are only pushed after both CMS apps are active. This is alert-only: nothing was rolled back.\n*Ref:* `${{ github.ref_name }}`\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
