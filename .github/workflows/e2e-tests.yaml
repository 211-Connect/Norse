name: Run E2E Test

permissions:
  contents: read

on:
  # Safety net: push events have no `inputs` context, so the job condition
  # below falls back to the `dev` matrix cells for this trigger.
  push:
    branches:
      - main

  workflow_call:
    inputs:
      environment:
        description: >-
          Which deployed environment to test against: 'dev' or 'production'.
          Selects the matrix cells to run (see `include` below).
        required: false
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: 'Which deployed environment to test against.'
        required: true
        type: choice
        options:
          - dev
          - production
        default: dev

jobs:
  # `jobs.<job_id>.if` does not have access to the `matrix` context (only
  # `github`/`needs`/`vars`/`inputs` — see GitHub's context-availability
  # table), so the target environment can't be filtered with a job-level
  # `if` on the matrixed job itself. Instead, compute the filtered matrix
  # here and hand it to `e2e-tests` via `needs.select-matrix.outputs.matrix`.
  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      # Single source of truth for the tenant × env test matrix. Base URLs and
      # test-account emails are derived from `e2e/fixtures/tenants.ts`; only the
      # shared password is a secret (see e2e/AGENTS.md "Multi-tenant test
      # matrix"). To add another tenant: add its dev + prod rows here and add
      # its fixture entry (including baseUrl) in e2e/fixtures/tenants.ts.
      - name: Filter matrix to the target environment
        id: filter
        env:
          # push/pull_request have no `inputs` context, so this falls back
          # to the `dev` cells for those triggers.
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
        run: |
          # MBOA production (mn.gov/adresources) is excluded here — it sits
          # behind bot/robot blockers that reject automated Playwright traffic.
          FULL_MATRIX='[
            {"tenant":"MBOA","env":"dev"},
            {"tenant":"DUPAGE","env":"dev"},
            {"tenant":"DUPAGE","env":"production"},
            {"tenant":"WA","env":"dev"},
            {"tenant":"WA","env":"production"},
            {"tenant":"VA","env":"dev"},
            {"tenant":"VA","env":"production"},
            {"tenant":"PA","env":"dev"},
            {"tenant":"PA","env":"production"},
            {"tenant":"AZ","env":"dev"},
            {"tenant":"AZ","env":"production"},
            {"tenant":"SCC","env":"dev"},
            {"tenant":"SCC","env":"production"}
          ]'
          FILTERED=$(echo "$FULL_MATRIX" | jq -c --arg env "$TARGET_ENV" '[.[] | select(.env == $env)]')
          echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-matrix.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      # Per-action caps (see e2e/timeouts.ts). Per-test ceiling: E2E_TEST_TIMEOUT_MS.
      E2E_SEARCH_NAV_TIMEOUT_MS: 20000
      E2E_PAGE_LOAD_TIMEOUT_MS: 40000
      E2E_UI_SHELL_TIMEOUT_MS: 20000
      E2E_DEFAULT_ACTION_TIMEOUT_MS: 20000
      E2E_TEST_TIMEOUT_MS: 600000
      E2E_TENANT_KEY: ${{ matrix.tenant }}
      E2E_TENANT_ENV: ${{ matrix.env == 'production' && 'prod' || 'dev' }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: |
          npx playwright test \
            --project=search-taxonomy \
            --project=translations \
            --project=search-geocode \
            --project=favorites \
            --project=accessibility \
            --project=resource-direct-link \
            --project=organization \
            --project=ai-classification

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.tenant }}-${{ matrix.env }}
          path: |
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
