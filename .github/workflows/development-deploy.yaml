name: Development Deploy

concurrency:
  group: development-deploy
  cancel-in-progress: false

permissions:
  contents: read

on:
  push:
    branches:
      - development
    paths:
      - 'bin/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - 'postcss.config.cjs'
      - 'components.json'
      - 'app.defaults.json'
      - 'Dockerfile'

  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-images.yaml
    with:
      environment: development
      umami_script_url: ${{ vars.DEVELOPMENT_UMAMI_SCRIPT_URL }}
      allow_search_engines: 'false'
    secrets:
      DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      MULTITENANT_APP_ID: ${{ secrets.DO_MULTITENANT_DEV_APP_ID }}
      MBOA_APP_ID: ${{ secrets.DO_MBOA_DEV_APP_ID }}

  e2e-tests:
    needs: deploy
    uses: ./.github/workflows/e2e-tests.yaml
    with:
      environment: dev
    secrets: inherit

  notify-deploy-failure:
    if: always() && needs.deploy.result == 'failure'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification - Deploy Failed
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Deploy Failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Development Deploy Failed*\nAn image could not be built or pushed, or its deployment did not become active. Public images are only pushed after both CMS deployments are active.\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

  notify-e2e-failure:
    if: always() && needs.e2e-tests.result == 'failure'
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification - E2E tests failed
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: *E2E Tests Failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Development E2E Tests Failed*\nEnd-to-end tests failed following a successful deployment.\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

  notify-e2e-success:
    if: needs.e2e-tests.result == 'success'
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification - E2E tests passed
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: *E2E Tests Passed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Development E2E Tests Passed*\nAll tenant e2e suites passed against dev following a successful deployment.\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
