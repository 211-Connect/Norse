name: Pull Request Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - development

jobs:
  lint-format-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run formatter check
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      # Temporary: the search-intent cut-over parity suite (ISS-2371). Removed by ISS-2377.
      - name: Run search-intent parity suite
        run: npm run test:parity

      - name: Build project
        run: npm run build
