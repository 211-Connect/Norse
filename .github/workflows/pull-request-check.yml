name: Pull Request Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - development

jobs:
  lint-format-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run formatter check
        run: npm run format:check

      - name: Build project
        run: npm run build

  # TEMPORARY: verify the e2e suite against dev tenants on this PR.
  # Remove this job before merging — e2e already runs on push to `main`
  # (see e2e-tests.yaml) and doesn't normally run on every PR.
  e2e-tests:
    uses: ./.github/workflows/e2e-tests.yaml
    with:
      environment: dev
    secrets: inherit
