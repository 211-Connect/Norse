name: Pull Request Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - development

jobs:
  lint-format-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run formatter check
        run: npm run format:check

      - name: Build project
        run: npm run build

  # TEMPORARY: run both dev and production e2e matrices on every PR for
  # extra confidence. Remove these two jobs once done testing.
  e2e-dev:
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      environment: dev

  e2e-production:
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
    with:
      environment: production
