apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # Exemplar `trace_id` (OTLP exemplars via Alloy remote write) -> Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
